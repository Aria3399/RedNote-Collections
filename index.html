<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>小红书收藏与点赞整理专家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .xhs-bg { background-color: #ff2442; }
        .xhs-text { color: #ff2442; }
        #notesContainer { column-gap: 1rem; width: 100%; }
        .break-inside-avoid { break-inside: avoid; -webkit-column-break-inside: avoid; }
        .toast-enter { opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
        .toast-show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden text-gray-800 flex flex-col font-sans">

    <!-- Toast 轻提示 -->
    <div id="toast" class="fixed bottom-6 right-6 bg-gray-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-xl z-50 flex items-center gap-2 toast-enter pointer-events-none">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span id="toast-text">保存成功</span>
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shrink-0 px-6 py-3 flex items-center justify-between shadow-sm z-30">
        <div class="flex items-center gap-3">
            <div class="xhs-bg text-white font-bold px-2.5 py-1 rounded-lg text-sm shadow-sm">小红书</div>
            <h1 class="text-base font-bold text-gray-900">收藏夹与点赞整理专家</h1>
            <span class="bg-emerald-50 text-emerald-600 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-200">合二为一终极版</span>
        </div>
        <div class="flex items-center gap-3">
            <!-- 抓取脚本下拉菜单 -->
            <div class="relative group">
                <button class="bg-red-50 text-red-600 hover:bg-red-100 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5 border border-red-200 shadow-sm">
                    <i data-lucide="code" class="w-3.5 h-3.5"></i>
                    <span>获取抓取脚本</span>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div class="absolute right-0 mt-1 w-64 bg-white rounded-xl shadow-xl border border-gray-100 py-1.5 hidden group-hover:block z-50 text-xs">
                    <div class="px-3 py-1 text-[10px] text-gray-400 font-bold uppercase tracking-wider">脚本1：默认收藏夹</div>
                    <button onclick="copyScript1Code()" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-center gap-2 text-gray-700">
                        <i data-lucide="copy" class="w-3.5 h-3.5 text-gray-400"></i> 复制【脚本1】源码
                    </button>
                    <button onclick="downloadScript1File()" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-center gap-2 text-gray-700">
                        <i data-lucide="download" class="w-3.5 h-3.5 text-gray-400"></i> 下载【脚本1】文件
                    </button>
                    
                    <div class="h-[1px] bg-gray-100 my-1"></div>
                    
                    <div class="px-3 py-1 text-[10px] text-gray-400 font-bold uppercase tracking-wider">脚本2：智能专辑助手</div>
                    <button onclick="copyScript2Code()" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-center gap-2 text-gray-700">
                        <i data-lucide="copy" class="w-3.5 h-3.5 text-gray-400"></i> 复制【脚本2】源码
                    </button>
                    <button onclick="downloadScript2File()" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-center gap-2 text-gray-700">
                        <i data-lucide="download" class="w-3.5 h-3.5 text-gray-400"></i> 下载【脚本2】文件
                    </button>

                    <div class="h-[1px] bg-gray-100 my-1"></div>

                    <div class="px-3 py-1 text-[10px] text-gray-400 font-bold uppercase tracking-wider">脚本3：点赞夹抓取</div>
                    <button onclick="copyScript3Code()" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-center gap-2 text-gray-700">
                        <i data-lucide="copy" class="w-3.5 h-3.5 text-gray-400"></i> 复制【脚本3】点赞源码
                    </button>
                    <button onclick="downloadScript3File()" class="w-full text-left px-4 py-2 hover:bg-gray-50 flex items-center gap-2 text-gray-700">
                        <i data-lucide="download" class="w-3.5 h-3.5 text-gray-400"></i> 下载【脚本3】点赞文件
                    </button>
                </div>
            </div>

            <div class="h-4 w-[1px] bg-gray-200 mx-1"></div>

            <button id="undoBtn" onclick="undoAction()" disabled title="撤回 (Ctrl+Z)" class="bg-gray-100 text-gray-700 hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                <i data-lucide="undo-2" class="w-3.5 h-3.5"></i>
                <span>撤回</span>
            </button>
            <button id="redoBtn" onclick="redoAction()" disabled title="恢复 (Ctrl+Y)" class="bg-gray-100 text-gray-700 hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                <i data-lucide="redo-2" class="w-3.5 h-3.5"></i>
                <span>恢复</span>
            </button>

            <div class="h-4 w-[1px] bg-gray-200 mx-1"></div>

            <button onclick="document.getElementById('csvFileInput').click()" class="xhs-bg text-white text-xs px-3.5 py-2 rounded-lg font-medium hover:opacity-90 transition flex items-center gap-1.5 shadow-sm">
                <i data-lucide="file-plus" class="w-4 h-4"></i>
                <span>导入 CSV (增量合并)</span>
            </button>
            <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileSelect(event)">
            
            <button onclick="exportBackupJSON()" class="bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>导出完整备份</span>
            </button>

            <button onclick="document.getElementById('jsonFileInput').click()" class="bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                <span>恢复备份</span>
            </button>
            <input type="file" id="jsonFileInput" accept=".json" class="hidden" onchange="handleJSONImport(event)">

            <button onclick="clearData()" class="text-xs text-gray-400 hover:text-red-500 transition px-2 py-1 ml-1">清空</button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 overflow-hidden">
        <!-- 左侧分类栏 -->
        <aside class="w-64 bg-white border-r border-gray-200 p-4 flex flex-col shrink-0 h-full">
            
            <!-- 第一层：点赞、收藏、全部合并 三态切换 -->
            <div class="grid grid-cols-3 gap-1 bg-gray-100 p-1 rounded-xl mb-2 shrink-0 text-[11px] font-medium text-center">
                <button onclick="switchSourceFilter('collect')" id="srcTabCollect" class="py-1.5 rounded-lg bg-white shadow-sm text-gray-900 transition font-bold">收藏</button>
                <button onclick="switchSourceFilter('like')" id="srcTabLike" class="py-1.5 rounded-lg text-gray-500 hover:text-gray-900 transition">点赞</button>
                <button onclick="switchSourceFilter('ALL')" id="srcTabALL" class="py-1.5 rounded-lg text-gray-500 hover:text-gray-900 transition">点赞+收藏</button>
            </div>

            <!-- 第二层：AI智能分类 vs 原专辑分类 切换按钮区 -->
            <div class="bg-gray-100 p-1 rounded-xl flex items-center gap-1 mb-3 shrink-0">
                <button id="modeAiBtn" onclick="switchMode('ai')" class="flex-1 py-1.5 text-center text-xs font-bold rounded-lg transition shadow-sm bg-white text-red-600">
                    AI 智能分类
                </button>
                <button id="modeAlbumBtn" onclick="switchMode('album')" class="flex-1 py-1.5 text-center text-xs font-medium rounded-lg transition text-gray-500 hover:text-gray-800">
                    原专辑分类
                </button>
            </div>

            <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 px-2 flex items-center justify-between shrink-0">
                <span id="categoryListTitle">分类列表</span>
                <i data-lucide="folder-tree" class="w-3.5 h-3.5"></i>
            </div>
            
            <div id="categoryList" class="space-y-1 overflow-y-auto flex-1 pr-1"></div>

            <div id="customCategoryAddArea" class="pt-2 shrink-0 border-t border-gray-100 mt-2">
                <button onclick="addCustomCategory()" class="w-full flex items-center justify-center gap-1.5 py-2 px-3 border border-dashed border-gray-300 hover:border-red-400 text-gray-600 hover:text-red-500 rounded-lg text-xs font-medium transition">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>添加自定义分类</span>
                </button>
            </div>

            <div class="pt-3 text-[11px] text-gray-400 px-2 leading-relaxed shrink-0 border-t border-gray-100 mt-2">
                💡 支持收藏原专辑、点赞夹独立查看与合并管理，图片自动转存本地。
            </div>
        </aside>

        <!-- 右侧内容区 -->
        <main class="flex-1 flex flex-col overflow-y-auto p-6 h-full">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200/80 mb-6 flex flex-wrap gap-4 items-center justify-between shrink-0">
                <div class="relative flex-1 min-w-[280px]">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="filterAndRender()" 
                           placeholder="搜索 分类 / Tag / 标题 / 博主 / 原专辑 / 我的想法..." 
                           class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-red-400 transition">
                </div>

                <div class="flex items-center gap-4 text-xs text-gray-500">
                    <span id="statsCount" class="font-medium">共 0 条笔记</span>
                    
                    <div class="flex items-center gap-1.5">
                        <label class="text-gray-400">每排显示：</label>
                        <select id="colsSelect" onchange="changeColumns(this.value)" class="bg-gray-50 border border-gray-200 text-xs rounded-lg p-1.5 focus:outline-none focus:ring-2 focus:ring-red-400 font-medium">
                            <option value="3">3 个卡片</option>
                            <option value="4" selected>4 个卡片</option>
                            <option value="5">5 个卡片</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="notesContainer"></div>

            <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center text-gray-400 py-20">
                <i data-lucide="folder-open" class="w-12 h-12 mb-3 text-gray-300"></i>
                <p class="text-sm font-medium">暂无笔记，请导入 CSV 文件或通过脚本抓取</p>
            </div>
        </main>
    </div>

    <!-- 编辑弹窗 -->
    <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-100">
            <h3 class="text-base font-bold text-gray-900 mb-4 flex items-center gap-2">
                <i data-lucide="edit-3" class="w-4 h-4 xhs-text"></i> 编辑笔记信息
            </h3>
            <input type="hidden" id="editNoteId">
            
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block text-gray-600 font-medium mb-1">笔记标题：</label>
                    <textarea id="editTitleInput" rows="2" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-red-400 leading-snug resize-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-600 font-medium mb-1">AI 分类：</label>
                        <select id="editCategorySelect" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-red-400"></select>
                    </div>
                    <div>
                        <label class="block text-gray-600 font-medium mb-1">原专辑分类：</label>
                        <input type="text" id="editAlbumInput" placeholder="所属原专辑名称" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-red-400">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">封面图片链接 / Base64：</label>
                    <input type="text" id="editCoverInput" placeholder="输入新的图片链接" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-red-400">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">自定义 Tag（空格分隔）：</label>
                    <input type="text" id="editTagsInput" placeholder="例如: #AI工具 #提示词 #爆款" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-red-400">
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeEditModal()" class="px-4 py-2 text-xs text-gray-500 hover:bg-gray-100 rounded-lg font-medium transition">取消</button>
                <button onclick="saveNoteEdit()" class="px-4 py-2 text-xs xhs-bg text-white rounded-lg font-medium hover:opacity-90 transition shadow-sm">保存修改</button>
            </div>
        </div>
    </div>

    <script>
        // ----------------- 脚本1：默认收藏夹导出源码 -----------------
        const tampermonkeyScript1Code = `// ==UserScript==
// @name XHS Collected Notes Exporter 1
// @namespace https://tampermonkey.net/
// @version 1.0.2
// @description Export loaded collected notes on xiaohongshu.com to CSV.
// @match https://www.xiaohongshu.com/*
// @match https://*.xiaohongshu.com/*
// @run-at document-idle
// @icon https://www.xiaohongshu.com/favicon.ico
// @grant none
// ==/UserScript==
(function () {
'use strict';
const notes = [];
const seen = new Set();
let autoScrollTimer = null;
function pickCover(note) { return note?.cover?.url_default || note?.cover?.url_pre || note?.note_card?.cover?.url_default || note?.note_card?.cover?.url_pre || ''; }
function pickTitle(note) { return note?.display_title || note?.title || note?.note_card?.display_title || note?.note_card?.title || ''; }
function pickNoteId(note) { return note?.note_id || note?.id || note?.note_card?.note_id || note?.note_card?.id || ''; }
function pickToken(note) { return note?.xsec_token || note?.note_card?.xsec_token || ''; }
function pickUser(note) { return note?.user || note?.user_info || note?.note_card?.user || note?.note_card?.user_info || {}; }
function pickLikedCount(note) { return note?.interact_info?.liked_count || note?.note_card?.interact_info?.liked_count || ''; }
function normalizeNote(raw) {
const note = raw?.note_card || raw;
const noteId = pickNoteId(note);
const token = pickToken(note);
const user = pickUser(note);
const url = noteId ? \`https://www.xiaohongshu.com/explore/\${noteId}\${token ? \`?xsec_token=\${encodeURIComponent(token)}&xsec_source=pc_user\` : ''}\` : '';
return {
note_id: noteId, title: pickTitle(note), author: user.nickname || user.nick_name || user.name || '', user_id: user.user_id || user.id || '', liked_count: pickLikedCount(note), cover: pickCover(note), url, category: '默认收藏夹', tags: '', remark: '', exported_from: 'collect_page_1', exported_at: new Date().toISOString()
};
}
function addNotes(list) {
if (!Array.isArray(list)) return;
for (const item of list) {
const note = normalizeNote(item);
if (!note.note_id || seen.has(note.note_id)) continue;
seen.add(note.note_id); notes.push(note);
}
updateCounter();
}
function findNoteLists(data, found = []) {
if (!data || typeof data !== 'object') return found;
if (Array.isArray(data)) {
if (data.some(item => item && typeof item === 'object' && (item.note_id || item.id || item.note_card))) found.push(data);
for (const item of data) findNoteLists(item, found);
return found;
}
for (const value of Object.values(data)) findNoteLists(value, found);
return found;
}
function shouldReadUrl(url) {
const text = String(url || '');
return text.includes('/api/sns/web/v2/note/collect/page') || text.includes('/api/sns/web/v1/note/collect/page') || text.includes('/api/sns/web/v1/user/collect');
}
function handleApiResponse(url, text) {
if (!shouldReadUrl(url)) return;
try { const data = JSON.parse(text); for (const list of findNoteLists(data)) addNotes(list); } catch (e) {}
}
function interceptXHR() {
const open = XMLHttpRequest.prototype.open, send = XMLHttpRequest.prototype.send;
XMLHttpRequest.prototype.open = function(m, u) { this.__xhs_export_url = u; return open.apply(this, arguments); };
XMLHttpRequest.prototype.send = function() { this.addEventListener('load', () => handleApiResponse(this.__xhs_export_url, this.responseText)); return send.apply(this, arguments); };
}
function interceptFetch() {
const fetch = window.fetch;
window.fetch = async function(...args) {
const res = await fetch.apply(this, args);
const url = args[0]?.url || args[0];
if (shouldReadUrl(url)) res.clone().text().then(t => handleApiResponse(url, t));
return res;
};
}
function exportCsv() {
if (!notes.length) { alert('还没有抓到收藏笔记。'); return; }
const headers = Object.keys(notes[0]);
const rows = [headers.join(','), ...notes.map(n => headers.map(h => \`"\${String(n[h] ?? '').replaceAll('"', '""')}"\`).join(','))];
const blob = new Blob(['\\ufeff' + rows.join('\\n')], { type: 'text/csv;charset=utf-8' });
const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
link.download = \`xhs_default_collected_notes_\${new Date().toISOString().slice(0, 10)}.csv\`;
link.click(); URL.revokeObjectURL(link.href);
}
function updateCounter() {
const counter = document.querySelector('#xhs-collect-export-counter');
if (counter) counter.textContent = \`已抓到：\${notes.length} 条\`;
}
function init() {
interceptXHR(); interceptFetch();
if (document.querySelector('.xhs-collect-exporter')) return;
const p = document.createElement('div'); p.className = 'xhs-collect-exporter';
p.style.cssText = 'position:fixed !important; left:18px !important; top:18px !important; z-index:2147483647 !important; width:210px !important; padding:12px !important; border-radius:12px !important; background:#18181b !important; color:#fff !important; box-shadow:0 10px 30px rgba(0,0,0,.22) !important; font-size:13px !important; font-family:Arial,sans-serif !important;';
p.innerHTML = \`<div><strong>默认收藏夹导出 1</strong></div><div id="xhs-collect-export-counter">已抓到：0 条</div><button id="s-btn" style="width:100%!important;margin-top:8px!important;border:0!important;border-radius:8px!important;padding:9px 10px!important;background:#ff2442!important;color:#fff!important;cursor:pointer!important;font-size:13px!important;">自动滚动抓取</button><button id="d-btn" style="width:100%!important;margin-top:8px!important;border:0!important;border-radius:8px!important;padding:9px 10px!important;background:#52525b!important;color:#fff!important;cursor:pointer!important;font-size:13px!important;">导出 CSV</button>\`;
document.documentElement.appendChild(p);
let autoScrollTimer = null;
document.querySelector('#s-btn').onclick = function() {
if (autoScrollTimer) { clearInterval(autoScrollTimer); autoScrollTimer = null; this.textContent = '自动滚动抓取'; }
else { this.textContent = '停止滚动'; autoScrollTimer = setInterval(() => window.scrollTo(0, document.body.scrollHeight), 1200); }
};
document.querySelector('#d-btn').onclick = exportCsv;
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();`;

        // ----------------- 脚本2：智能专辑助手 -----------------
        const tampermonkeyScript2Code = `// ==UserScript==
// @name XHS Auto Board Crawler Pro
// @namespace https://tampermonkey.net/
// @version 4.0.0
// @description Automatically click into each XHS board (album), scrape notes with board name, go back, and repeat for all boards!
// @match https://www.xiaohongshu.com/*
// @match https://*.xiaohongshu.com/*
// @run-at document-idle
// @icon https://www.xiaohongshu.com/favicon.ico
// @grant none
// ==/UserScript==
(function () {
'use strict';

let allNotes = [];
let seenNoteIds = new Set();
let isCrawling = false;

function injectStyle() {
if (document.querySelector('#xhs-auto-exporter-style')) return;
const style = document.createElement('style');
style.id = 'xhs-auto-exporter-style';
style.textContent = \`
.xhs-auto-exporter {
position: fixed !important;
left: 18px !important;
top: 18px !important;
z-index: 2147483647 !important;
width: 240px !important;
padding: 14px !important;
border-radius: 12px !important;
background: #18181b !important;
color: #fff !important;
box-shadow: 0 10px 30px rgba(0,0,0,.3) !important;
font-size: 13px !important;
line-height: 1.4 !important;
font-family: Arial, sans-serif !important;
}
.xhs-auto-exporter .status-text {
color: #ff2442 !important;
font-weight: bold !important;
margin: 6px 0 10px 0 !important;
word-break: break-all !important;
}
.xhs-auto-exporter button {
width: 100% !important;
margin-top: 6px !important;
border: 0 !important;
border-radius: 8px !important;
padding: 9px 10px !important;
background: #ff2442 !important;
color: #fff !important;
cursor: pointer !important;
font-size: 13px !important;
font-weight: bold;
}
.xhs-auto-exporter button.secondary {
background: #52525b !important;
}
\`;
(document.head || document.documentElement).appendChild(style);
}

function pickCover(note) {
return note?.cover?.url_default || note?.cover?.url_pre || note?.note_card?.cover?.url_default || note?.note_card?.cover?.url_pre || '';
}
function pickTitle(note) {
return note?.display_title || note?.title || note?.note_card?.display_title || note?.note_card?.title || '';
}
function pickNoteId(note) {
return note?.note_id || note?.id || note?.note_card?.note_id || note?.note_card?.id || '';
}
function pickToken(note) {
return note?.xsec_token || note?.note_card?.xsec_token || '';
}
function pickUser(note) {

            redoStack.push({
                notes: JSON.parse(JSON.stringify(allNotes)),
                categories: [...categoryList]
            });
            const prev = undoStack.pop();
            allNotes = prev.notes;
            categoryList = prev.categories;
            await localforage.setItem("xhs_custom_categories", categoryList);
            await localforage.setItem("xhs_v10_merged_notes", allNotes);
            renderCategories(); filterAndRender(); updateUndoRedoButtons();
            showToast("已成功撤回");
        }

        async function redoAction() {
            if (redoStack.length === 0) return;
            undoStack.push({
                notes: JSON.parse(JSON.stringify(allNotes)),
                categories: [...categoryList]
            });
            const next = redoStack.pop();
            allNotes = next.notes;
            categoryList = next.categories;
            await localforage.setItem("xhs_custom_categories", categoryList);
            await localforage.setItem("xhs_v10_merged_notes", allNotes);
            renderCategories(); filterAndRender(); updateUndoRedoButtons();
            showToast("已成功恢复");
        }

        function updateUndoRedoButtons() {
            document.getElementById('undoBtn').disabled = undoStack.length === 0;
            document.getElementById('redoBtn').disabled = redoStack.length === 0;
        }

        function showToast(message = "保存成功") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = message;
            toast.classList.add('toast-show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('toast-show'), 2000);
        }

        async function addCustomCategory() {
            const catName = prompt("请输入新的自定义 AI 分类名称：");
            if (catName && catName.trim() !== '') {
                const cleanCat = catName.trim();
                if (!categoryList.includes(cleanCat)) {
                    pushUndoState();
                    categoryList.push(cleanCat);
                    await localforage.setItem("xhs_custom_categories", categoryList);
                    renderCategories();
                    showToast("分类添加成功");
                } else alert("该分类名称已存在！");
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const isLikeFile = file.name.includes('like') || currentSourceFilter === 'like';

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async function(results) {
                    pushUndoState();
                    const newParsedNotes = processRawCSVData(results.data, isLikeFile);
                    
                    const existingMap = new Map();
                    allNotes.forEach(note => {
                        const key = (note.link && note.link !== '#' ? note.link : note.title) + '_' + note.sourceType;
                        existingMap.set(key, note);
                    });

                    let addedCount = 0;
                    newParsedNotes.forEach(newNote => {
                        const key = (newNote.link && newNote.link !== '#' ? newNote.link : newNote.title) + '_' + newNote.sourceType;
                        if (existingMap.has(key)) {
                            const ex = existingMap.get(key);
                            ex.likes = newNote.likes || ex.likes;
                            if (newNote.cover) ex.cover = newNote.cover;
                            if (newNote.originalAlbum && newNote.originalAlbum !== '默认专辑') {
                                ex.originalAlbum = newNote.originalAlbum;
                            }
                        } else {
                            allNotes.unshift(newNote);
                            addedCount++;
                        }
                    });

                    await localforage.setItem("xhs_v10_merged_notes", allNotes);
                    event.target.value = '';
                    renderCategories();
                    filterAndRender();
                    showToast(`成功导入并新增 ${addedCount} 条笔记`);
                    cacheMissingImages();
                }
            });
        }

        function parseCountNumber(rawVal) {
            if (!rawVal) return 0;
            const str = String(rawVal).trim().toLowerCase();
            const num = parseFloat(str.replace(/[^0-9.]/g, '')) || 0;
            if (str.includes('万') || str.includes('w')) return Math.round(num * 10000);
            return Math.round(num);
        }

        function formatCountDisplay(count) {
            if (count >= 10000) return (count / 10000).toFixed(1) + 'w';
            return count;
        }

        function extractKeywords(text, maxLength = 5) {
            if (!text) return [];
            const cleanText = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ' ');
            const words = cleanText.split(/\s+/);
            const result = [];
            for (let word of words) {
                word = word.trim();
                if (word.length >= 2 && word.length <= maxLength && !STOP_WORDS.has(word)) {
                    result.push(word);
                }
            }
            return result;
        }

        function processRawCSVData(rawData, isLike = false) {
            return rawData.map((item) => {
                const getVal = (keys) => {
                    for (let k of keys) {
                        for (let itemKey in item) {
                            if (itemKey.trim().toLowerCase() === k.toLowerCase()) return item[itemKey];
                        }
                    }
                    return '';
                };

                const title = String(getVal(['标题', 'title', '笔记标题']) || '').trim();
                const remark = String(getVal(['remark', '正文', '内容', 'desc', 'content']) || '').trim();
                const rawTagsStr = String(getVal(['tags', '标签', '话题']) || '').trim();
                const author = String(getVal(['作者', 'author', '博主']) || '未知作者').trim();
                const link = String(getVal(['链接', 'link', 'url']) || '#').trim();
                const rawCover = String(getVal(['封面', 'cover', '图片']) || '').trim();
                const csvCategory = String(getVal(['category', '分类', '专辑', '收藏夹']) || (isLike ? '点赞夹' : '默认专辑')).trim();
                const likes = parseCountNumber(getVal(['点赞数', '点赞', 'likes', 'liked_count']));

                const fullText = (title + ' ' + remark + ' ' + rawTagsStr).toLowerCase();

                let aiCategory = '城市生活 & 探店';
                for (let [catName, keywords] of Object.entries(PROMPT_CATEGORIES)) {
                    if (keywords.some(kw => fullText.includes(kw.toLowerCase()))) {
                        aiCategory = catName;
                        break;
                    }
                }

                const titleKeywords = extractKeywords(title);
                let tag1 = titleKeywords[0] || '精选干货';
                let tag2 = titleKeywords.find(w => w !== tag1) || '实用指南';
                let finalTags = `#${tag1} #${tag2}`;

                const sourceType = isLike || csvCategory.includes('点赞') ? 'like' : 'collect';
                const originalAlbum = sourceType === 'like' ? '点赞夹' : (csvCategory || '默认专辑');

                return {
                    id: 'note_' + Date.now + '_' + Math.random().toString(36).substr(2, 4),
                    title: title || '无标题笔记',
                    author, link, 
                    cover: rawCover, 
                    localCover: '',
                    likes,
                    aiCategory,                
                    originalAlbum, 
                    sourceType,
                    ai_tags: finalTags,
                    myThoughts: ''
                };
            });
        }

        function renderCategories() {
            const container = document.getElementById('categoryList');
            container.innerHTML = '';

            let scopedNotes = allNotes.filter(n => {
                if (currentSourceFilter === 'ALL') return true;
                return n.sourceType === currentSourceFilter;
            });

            if (currentMode === 'ai') {
                const categoryMap = {};
                scopedNotes.forEach(note => {
                    const cat = note.aiCategory || '城市生活 & 探店';
                    categoryMap[cat] = (categoryMap[cat] || 0) + 1;
                });

                const allBtn = document.createElement('button');
                allBtn.className = `w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition ${currentCategory === 'ALL' ? 'bg-red-50 text-red-600 font-bold' : 'text-gray-600 hover:bg-gray-100'}`;
                allBtn.onclick = () => switchCategory('ALL');
                allBtn.innerHTML = `
                    <span class="flex items-center gap-2"><i data-lucide="layers" class="w-3.5 h-3.5"></i>全部笔记</span>
                    <span class="bg-gray-200/60 px-2 py-0.5 rounded-full text-[10px] text-gray-500">${scopedNotes.length}</span>
                `;
                container.appendChild(allBtn);

                categoryList.forEach(cat => {
                    const count = categoryMap[cat] || 0;
                    const div = document.createElement('div');
                    const isSelected = currentCategory === cat;
                    div.className = `group w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition cursor-pointer ${isSelected ? 'bg-red-50 text-red-600 font-bold' : 'text-gray-600 hover:bg-gray-100'}`;
                    div.onclick = () => switchCategory(cat);
                    
                    div.innerHTML = `
                        <span class="flex items-center gap-2 truncate flex-1 pr-2">
                            <i data-lucide="folder" class="w-3.5 h-3.5 shrink-0"></i>
                            <span class="truncate">${cat}</span>
                        </span>
                        <span class="bg-gray-200/60 px-2 py-0.5 rounded-full text-[10px] text-gray-500">${count}</span>
                    `;
                    container.appendChild(div);
                });
            } else {
                const albumMap = {};
                scopedNotes.forEach(note => {
                    const alb = note.originalAlbum || '默认专辑';
                    albumMap[alb] = (albumMap[alb] || 0) + 1;
                });

                const allBtn = document.createElement('button');
                allBtn.className = `w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition ${currentCategory === 'ALL' ? 'bg-red-50 text-red-600 font-bold' : 'text-gray-600 hover:bg-gray-100'}`;
                allBtn.onclick = () => switchCategory('ALL');
                allBtn.innerHTML = `
                    <span class="flex items-center gap-2"><i data-lucide="book-open" class="w-3.5 h-3.5"></i>全部原专辑笔记</span>
                    <span class="bg-gray-200/60 px-2 py-0.5 rounded-full text-[10px] text-gray-500">${scopedNotes.length}</span>
                `;
                container.appendChild(allBtn);

                Object.keys(albumMap).forEach(alb => {
                    const count = albumMap[alb];
                    const div = document.createElement('div');
                    const isSelected = currentCategory === alb;
                    div.className = `group w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition cursor-pointer ${isSelected ? 'bg-red-50 text-red-600 font-bold' : 'text-gray-600 hover:bg-gray-100'}`;
                    div.onclick = () => switchCategory(alb);
                    
                    div.innerHTML = `
                        <span class="flex items-center gap-2 truncate flex-1 pr-2">
                            <i data-lucide="bookmark" class="w-3.5 h-3.5 shrink-0 text-red-400"></i>
                            <span class="truncate">${alb}</span>
                        </span>
                        <span class="bg-gray-200/60 px-2 py-0.5 rounded-full text-[10px] text-gray-500">${count}</span>
                    `;
                    container.appendChild(div);
                });
            }

            lucide.createIcons();
        }

        function switchCategory(cat) {
            currentCategory = cat;
            renderCategories();
            filterAndRender();
        }

        function filterAndRender() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allNotes.filter(n => {
                if (currentSourceFilter !== 'ALL' && n.sourceType !== currentSourceFilter) return false;
                if (currentCategory === 'ALL') return true;
                if (currentMode === 'ai') {
                    return (n.aiCategory || '城市生活 & 探店') === currentCategory;
                } else {
                    return (n.originalAlbum || '默认专辑') === currentCategory;
                }
            });

            if (searchText) {
                filtered = filtered.filter(n => 
                    n.title.toLowerCase().includes(searchText) ||
                    n.author.toLowerCase().includes(searchText) ||
                    (n.aiCategory && n.aiCategory.toLowerCase().includes(searchText)) ||
                    (n.originalAlbum && n.originalAlbum.toLowerCase().includes(searchText)) ||
                    n.ai_tags.toLowerCase().includes(searchText) ||
                    (n.myThoughts && n.myThoughts.toLowerCase().includes(searchText))
                );
            }

            const container = document.getElementById('notesContainer');
            const emptyState = document.getElementById('emptyState');
            document.getElementById('statsCount').innerText = `共 ${filtered.length} 条笔记`;

            container.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(note => {
                const card = document.createElement('div');
                card.className = "break-inside-avoid mb-4 bg-white rounded-xl shadow-sm hover:shadow-md border border-gray-200/70 overflow-hidden transition group flex flex-col";

                let displayImgUrl = note.localCover || (note.cover ? `https://images.weserv.nl/?url=${encodeURIComponent(formatUrl(note.cover))}` : '');

                const coverHtml = (note.localCover || note.cover) ? 
                    `<div class="w-full h-48 bg-gray-100 overflow-hidden relative">
                        <img src="${displayImgUrl}" alt="封面" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" onerror="this.onerror=null; this.parentElement.style.display='none';">
                        <span class="absolute top-2 left-2 bg-black/60 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-md font-medium">
                            ${note.originalAlbum || '默认专辑'}
                        </span>
                    </div>` : '';

                const tagsHtml = note.ai_tags ? note.ai_tags.split(' ').map(t => `<span class="bg-red-50 text-red-600 text-[10px] font-medium px-2 py-0.5 rounded-md">${t}</span>`).join(' ') : '';

                card.innerHTML = `
                    ${coverHtml}
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <div>
                            <div class="flex items-center justify-between text-[11px] text-gray-400 mb-1">
                                <div class="flex items-center gap-1 text-gray-500 font-medium">
                                    <i data-lucide="heart" class="w-3.5 h-3.5 text-red-500 fill-red-500"></i>
                                    <span>${formatCountDisplay(note.likes || 0)}</span>
                                </div>
                                <button onclick="openEditModal('${note.id}')" class="text-gray-400 hover:text-red-500 transition flex items-center gap-0.5">
                                    <i data-lucide="edit-2" class="w-3 h-3"></i> 编辑
                                </button>
                            </div>
                            
                            <h3 class="text-xs font-bold text-gray-800 line-clamp-2 leading-snug hover:text-red-500 transition">
                                ${note.title}
                            </h3>
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                ${tagsHtml}
                            </div>
                        </div>

                        <div class="mt-2.5 bg-gray-50 rounded-lg p-2 border border-gray-200/80 text-xs flex flex-col gap-1">
                            <div class="text-[10px] font-bold text-gray-500 flex items-center justify-between">
                                <span class="flex items-center gap-1"><i data-lucide="pen-tool" class="w-3 h-3 text-gray-400"></i> 我的想法</span>
                                <button onclick="saveThoughts('${note.id}')" class="text-gray-600 hover:text-gray-900 bg-gray-200/80 hover:bg-gray-300 px-2 py-0.5 rounded text-[10px] font-bold transition flex items-center gap-0.5">
                                    <i data-lucide="check" class="w-3 h-3"></i> 保存
                                </button>
                            </div>
                            <textarea id="thought-input-${note.id}"
                                      placeholder="记录对此笔记的想法、备忘或灵感..." 
                                      class="w-full bg-white border border-gray-200 rounded p-1.5 text-gray-700 text-xs focus:outline-none focus:ring-1 focus:ring-red-400 resize-none placeholder-gray-400 min-h-[58px] leading-relaxed">${note.myThoughts || ''}</textarea>
                        </div>

                        <div class="flex items-center justify-between mt-2.5 pt-2 text-[11px] text-gray-400 border-t border-gray-100">
                            <span class="text-gray-400 text-[11px] truncate max-w-[140px]">${note.author || '小红书'}</span>
                            <a href="${note.link}" target="_blank" class="flex items-center gap-1 text-xs text-blue-600 hover:underline font-medium ml-auto">
                                打开原文 <i data-lucide="external-link" class="w-3 h-3"></i>
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            changeColumns(currentCols);
            lucide.createIcons();
        }

        async function saveThoughts(noteId) {
            const textarea = document.getElementById(`thought-input-${noteId}`);
            if (!textarea) return;
            const val = textarea.value;
            const note = allNotes.find(n => n.id === noteId);
            if (note) {
                pushUndoState();
                note.myThoughts = val;
                await localforage.setItem("xhs_v10_merged_notes", allNotes);
                showToast("保存成功");
            }
        }

        function openEditModal(noteId) {
            const note = allNotes.find(n => n.id === noteId);
            if (!note) return;

            document.getElementById('editNoteId').value = noteId;
            document.getElementById('editTitleInput').value = note.title || '';
            document.getElementById('editCoverInput').value = note.cover || '';
            document.getElementById('editTagsInput').value = note.ai_tags || '';
            document.getElementById('editAlbumInput').value = note.originalAlbum || '默认专辑';

            const select = document.getElementById('editCategorySelect');
            select.innerHTML = '';
            categoryList.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                if (cat === (note.aiCategory || '城市生活 & 探店')) opt.selected = true;
                select.appendChild(opt);
            });

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveNoteEdit() {
            const noteId = document.getElementById('editNoteId').value;
            const note = allNotes.find(n => n.id === noteId);
            if (!note) return;

            pushUndoState();
            note.title = document.getElementById('editTitleInput').value.trim() || '无标题笔记';
            note.aiCategory = document.getElementById('editCategorySelect').value;
            note.originalAlbum = document.getElementById('editAlbumInput').value.trim() || '默认专辑';
            
            const newCover = document.getElementById('editCoverInput').value.trim();
            if (newCover !== note.cover) {
                note.cover = newCover;
                note.localCover = '';
            }

            let tagsVal = document.getElementById('editTagsInput').value.trim();
            if (tagsVal) {
                note.ai_tags = tagsVal.split(/\s+/).map(t => t.startsWith('#') ? t : `#${t}`).join(' ');
            } else {
                note.ai_tags = '';
            }

            await localforage.setItem("xhs_v10_merged_notes", allNotes);
            closeEditModal();
            renderCategories();
            filterAndRender();
            showToast("修改已保存");
            cacheMissingImages();
        }

        function exportBackupJSON() {
            if (allNotes.length === 0) {
                alert("当前暂无可导出的数据！");
                return;
            }
            const backupData = {
                version: "2.0",
                exportTime: new Date().toISOString(),
                categories: categoryList,
                notes: allNotes
            };
            const jsonStr = JSON.stringify(backupData, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `小红书完整备份_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("导出备份成功");
        }

        function handleJSONImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data && Array.isArray(data.notes)) {
                        pushUndoState();
                        allNotes = data.notes;
                        if (Array.isArray(data.categories)) {
                            categoryList = Array.from(new Set([...categoryList, ...data.categories]));
                            await localforage.setItem("xhs_custom_categories", categoryList);
                        }
                        await localforage.setItem("xhs_v10_merged_notes", allNotes);
                        event.target.value = '';
                        renderCategories();
                        filterAndRender();
                        showToast("恢复备份成功");
                    } else {
                        alert("无效的备份文件格式！");
                    }
                } catch(err) {
                    alert("解析备份文件失败！");
                }
            };
            reader.readAsText(file);
        }

        async function clearData() {
            if (confirm("确定要清空本地所有已整理的笔记数据吗？此操作无法撤销！")) {
                pushUndoState();
                await localforage.removeItem("xhs_v10_merged_notes");
                allNotes = [];
                renderCategories();
                filterAndRender();
                showToast("已清空所有数据");
            }
        }
    </script>
</body>
</html>
