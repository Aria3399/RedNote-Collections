<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>小红书收藏夹整理专家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .xhs-bg { background-color: #ff2442; }
        .xhs-text { color: #ff2442; }
        
        /* 瀑布流容器核心基础属性 */
        #notesContainer {
            column-gap: 1rem;
            width: 100%;
        }

        .break-inside-avoid { 
            break-inside: avoid; 
            -webkit-column-break-inside: avoid;
        }
        
        .toast-enter {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        .toast-show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden text-gray-800 flex flex-col font-sans">

    <!-- Toast 轻提示 -->
    <div id="toast" class="fixed bottom-6 right-6 bg-gray-900/90 backdrop-blur-md text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-xl z-50 flex items-center gap-2 toast-enter pointer-events-none">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span id="toast-text">保存成功</span>
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shrink-0 px-6 py-3 flex items-center justify-between shadow-sm z-30">
        <div class="flex items-center gap-3">
            <div class="xhs-bg text-white font-bold px-2.5 py-1 rounded-lg text-sm shadow-sm">小红书</div>
            <h1 class="text-base font-bold text-gray-900">收藏夹整理专家</h1>
            <span class="bg-emerald-50 text-emerald-600 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-200">图片自动转存本地</span>
        </div>
        <div class="flex items-center gap-3">
            <button id="undoBtn" onclick="undoAction()" disabled title="撤回 (Ctrl+Z)" class="bg-gray-100 text-gray-700 hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                <i data-lucide="undo-2" class="w-3.5 h-3.5"></i>
                <span>撤回</span>
            </button>
            <button id="redoBtn" onclick="redoAction()" disabled title="恢复 (Ctrl+Y)" class="bg-gray-100 text-gray-700 hover:bg-gray-200 disabled:opacity-40 disabled:cursor-not-allowed text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                <i data-lucide="redo-2" class="w-3.5 h-3.5"></i>
                <span>恢复</span>
            </button>

            <div class="h-4 w-[1px] bg-gray-200 mx-1"></div>

            <button onclick="document.getElementById('csvFileInput').click()" class="xhs-bg text-white text-xs px-3.5 py-2 rounded-lg font-medium hover:opacity-90 transition flex items-center gap-1.5 shadow-sm">
                <i data-lucide="file-plus" class="w-4 h-4"></i>
                <span>导入新 CSV (增量合并)</span>
            </button>
            <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileSelect(event)">
            
            <button onclick="exportBackupJSON()" class="bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>导出完整备份(含图片)</span>
            </button>

            <button onclick="document.getElementById('jsonFileInput').click()" class="bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                <span>恢复备份</span>
            </button>
            <input type="file" id="jsonFileInput" accept=".json" class="hidden" onchange="handleJSONImport(event)">

            <button onclick="clearData()" class="text-xs text-gray-400 hover:text-red-500 transition px-2 py-1 ml-2">清空数据</button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 overflow-hidden">
        <!-- 左侧分类栏 -->
        <aside class="w-64 bg-white border-r border-gray-200 p-4 flex flex-col shrink-0 h-full">
            <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-2 flex items-center justify-between shrink-0">
                <span>分类列表</span>
                <i data-lucide="folder-tree" class="w-3.5 h-3.5"></i>
            </div>
            
            <div id="categoryList" class="space-y-1 overflow-y-auto flex-1 pr-1"></div>

            <div class="pt-2 shrink-0 border-t border-gray-100 mt-2">
                <button onclick="addCustomCategory()" class="w-full flex items-center justify-center gap-1.5 py-2 px-3 border border-dashed border-gray-300 hover:border-red-400 text-gray-600 hover:text-red-500 rounded-lg text-xs font-medium transition">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>添加自定义分类</span>
                </button>
            </div>

            <div class="pt-3 text-[11px] text-gray-400 px-2 leading-relaxed shrink-0">
                💡 导入图片后会自动异步下载并转换为本地 Base64 格式，永久固定存储在浏览器中，再也不怕链接过期失效。
            </div>
        </aside>

        <!-- 右侧内容区 -->
        <main class="flex-1 flex flex-col overflow-y-auto p-6 h-full">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200/80 mb-6 flex flex-wrap gap-4 items-center justify-between shrink-0">
                <div class="relative flex-1 min-w-[280px]">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="filterAndRender()" 
                           placeholder="搜索 分类 / Tag / 标题 / 博主 / 我的想法..." 
                           class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-red-400 transition">
                </div>

                <div class="flex items-center gap-4 text-xs text-gray-500">
                    <span id="statsCount" class="font-medium">共 0 条笔记</span>
                    
                    <div class="flex items-center gap-1.5">
                        <label class="text-gray-400">每排显示：</label>
                        <select id="colsSelect" onchange="changeColumns(this.value)" class="bg-gray-50 border border-gray-200 text-xs rounded-lg p-1.5 focus:outline-none focus:ring-2 focus:ring-red-400 font-medium">
                            <option value="3">3 个卡片</option>
                            <option value="4" selected>4 个卡片</option>
                            <option value="5">5 个卡片</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="notesContainer"></div>

            <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center text-gray-400 py-20">
                <i data-lucide="folder-open" class="w-12 h-12 mb-3 text-gray-300"></i>
                <p class="text-sm font-medium">暂无笔记，请导入 CSV 文件</p>
            </div>
        </main>
    </div>

    <!-- 编辑弹窗 -->
    <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-gray-100">
            <h3 class="text-base font-bold text-gray-900 mb-4 flex items-center gap-2">
                <i data-lucide="edit-3" class="w-4 h-4 xhs-text"></i> 编辑笔记信息
            </h3>
            <input type="hidden" id="editNoteId">
            
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block text-gray-600 font-medium mb-1">笔记标题：</label>
                    <textarea id="editTitleInput" rows="2" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-red-400 leading-snug resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">选择分类：</label>
                    <select id="editCategorySelect" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-red-400">
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">封面图片链接 / Base64：</label>
                    <input type="text" id="editCoverInput" placeholder="输入新的图片链接" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-red-400">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">自定义 Tag（空格分隔）：</label>
                    <input type="text" id="editTagsInput" placeholder="例如: #AI工具 #提示词 #爆款" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-red-400">
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeEditModal()" class="px-4 py-2 text-xs text-gray-500 hover:bg-gray-100 rounded-lg font-medium transition">取消</button>
                <button onclick="saveNoteEdit()" class="px-4 py-2 text-xs xhs-bg text-white rounded-lg font-medium hover:opacity-90 transition shadow-sm">保存修改</button>
            </div>
        </div>
    </div>

    <script>
        let allNotes = [];
        let currentCategory = 'ALL';
        let currentCols = '4';
        let toastTimer = null;
        let undoStack = [];
        let redoStack = [];

        let categoryList = [
            'AI工具 & 科技', '副业搞钱 & 商业', '求职面试 & 职场', '自我提升 & 认知',
            '养生健康 & 变美', '旅行攻略 & 摄影', '美食料理 & 探店', '小说推文 & 阅读',
            '动漫影视 & 娱乐', '生活妙招 & 手工', '留学移民 & 海外生活', '城市生活 & 探店'
        ];

        const PROMPT_CATEGORIES = {
            'AI工具 & 科技': ['ai', 'chatgpt', '提示词', 'midjourney', '代码', 'python', '编程', '软件', '工具', '黑科技', 'github', '大模型', 'prompt', '自动化', '科技', '数码', '算法'],
            '副业搞钱 & 商业': ['副业', '搞钱', '商业', '创业', '赚钱', '变现', '模式', '私域', '项目', '店铺', '电商', '带货', '财商', '兼职', '招商'],
            '求职面试 & 职场': ['求职', '面试', '职场', '简历', '工作', '晋升', '跳槽', '涨薪', '沟通', '离职', '转行', 'hr', '八股文', '招聘', '实习'],
            '自我提升 & 认知': ['认知', '提升', '思维', '自律', '习惯', '管理', '阅读', '读书', '学习', '复盘', '高效', '进化', '书籍', '底层逻辑', '心态'],
            '养生健康 & 变美': ['养生', '健康', '变美', '减肥', '减脂', '护肤', '化妆', '美妆', '穿搭', '发型', '塑形', '瑜伽', '体态', '作息', '抗老', '内调'],
            '旅行攻略 & 摄影': ['旅行', '旅游', '攻略', '摄影', '拍照', '修图', '调色', '景点', '打卡', '民宿', '路线', '滤镜', '构图', '相机', '出游'],
            '美食料理 & 探店': ['美食', '料理', '做饭', '食谱', '烘焙', '菜谱', '探店', '好吃', '餐馆', '甜品', '减脂餐', '下饭菜', '小吃', '餐厅', '烹饪'],
            '小说推文 & 阅读': ['小说', '推文', '阅读', '看书', '书单', '推书', '短篇', '网文', '小说推荐', '文荒', '名著'],
            '动漫影视 & 娱乐': ['动漫', '影视', '娱乐', '电影', '电视剧', '追剧', '综艺', '影评', '追番', '演员', '剧情', '音乐', '歌单'],
            '生活妙招 & 手工': ['妙招', '手工', '收纳', '清洁', ' DIY ', 'diy', '好物', '家居', '装修', '改造', '生活小技巧', '手账', '折纸', '布置'],
            '留学移民 & 海外生活': ['留学', '移民', '海外', '雅思', '托福', '申研', '签证', '出国', '留学生', '海外生活', '租房', '绿卡', '海外探店'],
            '城市生活 & 探店': ['城市', '本地', '周末去哪儿', '探店', '同城', '展览', '逛街', '市集', '玩乐', '活动', '打卡点']
        };

        const STOP_WORDS = new Set([
            '这个', '可以', '怎么', '什么', '就是', '大家', '今天', '自己', '真的', '一个', '感觉', '分享', '推荐', '全网', '新手', '干货', '超级', '一定要',
            '关于', '如何', '整理', '方法', '必看', '建议', '收藏', '直接', '完整', '超全', '系列', '教程', '手把手', '居然', '原来', '千万', '不要'
        ]);

        document.addEventListener("DOMContentLoaded", async () => {
            lucide.createIcons();
            changeColumns(currentCols);

            try {
                const savedCats = await localforage.getItem("xhs_custom_categories");
                if (savedCats && Array.isArray(savedCats)) {
                    categoryList = Array.from(new Set([...categoryList, ...savedCats]));
                }

                const savedData = await localforage.getItem("xhs_v10_interactive_notes");
                if (savedData && savedData.length > 0) {
                    allNotes = savedData;
                    allNotes.forEach(n => {
                        if (n.category && !categoryList.includes(n.category)) {
                            categoryList.push(n.category);
                        }
                    });
                    renderCategories();
                    filterAndRender();

                    cacheMissingImages();
                } else {
                    renderCategories();
                    document.getElementById('emptyState').classList.remove('hidden');
                }
            } catch(e) { console.error(e); }

            updateUndoRedoButtons();

            document.addEventListener('keydown', (e) => {
                const activeTag = document.activeElement.tagName.toLowerCase();
                if (activeTag !== 'input' && activeTag !== 'textarea') {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                        e.preventDefault();
                        if (e.shiftKey) {
                            redoAction();
                        } else {
                            undoAction();
                        }
                    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                        e.preventDefault();
                        redoAction();
                    }
                }
            });
        });

        function changeColumns(cols) {
            currentCols = cols;
            const container = document.getElementById('notesContainer');
            if (container) {
                container.style.columnCount = cols;
                container.style.webkitColumnCount = cols;
                container.style.mozColumnCount = cols;
            }
        }

        function formatUrl(rawUrl) {
            if (!rawUrl) return '';
            let url = rawUrl.trim();
            if (url.startsWith('data:image')) return url;
            if (url.startsWith('//')) url = 'https:' + url;
            if (url.startsWith('http://')) url = url.replace('http://', 'https://');
            return url;
        }

        async function fetchImageAsBase64(url) {
            if (!url || url.startsWith('data:image')) return url;
            
            const cleanUrl = formatUrl(url).split('?')[0];
            const proxyUrl = `https://images.weserv.nl/?url=${encodeURIComponent(cleanUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("代理请求失败");
                const blob = await response.blob();

                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = () => resolve('');
                    reader.readAsDataURL(blob);
                });
            } catch (err) {
                console.warn("图片本地化失败，将保留原始链接:", url);
                return '';
            }
        }

        async function cacheMissingImages() {
            let hasUpdated = false;
            for (let note of allNotes) {
                if (note.cover && !note.cover.startsWith('data:image') && !note.localCover) {
                    const base64Data = await fetchImageAsBase64(note.cover);
                    if (base64Data) {
                        note.localCover = base64Data;
                        hasUpdated = true;
                    }
                }
            }
            if (hasUpdated) {
                await localforage.setItem("xhs_v10_interactive_notes", allNotes);
                filterAndRender();
            }
        }

        function pushUndoState() {
            if (undoStack.length >= 20) undoStack.shift();
            undoStack.push({
                notes: JSON.parse(JSON.stringify(allNotes)),
                categories: [...categoryList]
            });
            redoStack = []; 
            updateUndoRedoButtons();
        }

        async function undoAction() {
            if (undoStack.length === 0) {
                showToast("没有可撤回的操作");
                return;
            }
            redoStack.push({
                notes: JSON.parse(JSON.stringify(allNotes)),
                categories: [...categoryList]
            });

            const previousState = undoStack.pop();
            allNotes = previousState.notes;
            categoryList = previousState.categories;

            await localforage.setItem("xhs_custom_categories", categoryList);
            await localforage.setItem("xhs_v10_interactive_notes", allNotes);

            renderCategories();
            filterAndRender();
            updateUndoRedoButtons();
            showToast("已成功撤回");
        }

        async function redoAction() {
            if (redoStack.length === 0) {
                showToast("没有可恢复的操作");
                return;
            }
            undoStack.push({
                notes: JSON.parse(JSON.stringify(allNotes)),
                categories: [...categoryList]
            });

            const nextState = redoStack.pop();
            allNotes = nextState.notes;
            categoryList = nextState.categories;

            await localforage.setItem("xhs_custom_categories", categoryList);
            await localforage.setItem("xhs_v10_interactive_notes", allNotes);

            renderCategories();
            filterAndRender();
            updateUndoRedoButtons();
            showToast("已成功恢复");
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');
            if (undoBtn) undoBtn.disabled = undoStack.length === 0;
            if (redoBtn) redoBtn.disabled = redoStack.length === 0;
        }

        function showToast(message = "保存成功") {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toastText.innerText = message;
            
            toast.classList.add('toast-show');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('toast-show');
            }, 2000);
        }

        async function saveCategoryList() {
            await localforage.setItem("xhs_custom_categories", categoryList);
        }

        async function addCustomCategory() {
            const catName = prompt("请输入新的自定义分类名称：");
            if (catName && catName.trim() !== '') {
                const cleanCat = catName.trim();
                if (!categoryList.includes(cleanCat)) {
                    pushUndoState();
                    categoryList.push(cleanCat);
                    await saveCategoryList();
                    renderCategories();
                    showToast("分类添加成功");
                } else {
                    alert("该分类名称已存在！");
                }
            }
        }

        async function editCategoryName(oldCatName, event) {
            if (event) event.stopPropagation();
            const newCatName = prompt(`修改分类名称：`, oldCatName);
            if (newCatName && newCatName.trim() !== '' && newCatName.trim() !== oldCatName) {
                const cleanCat = newCatName.trim();
                if (categoryList.includes(cleanCat)) {
                    alert("已存在同名分类！");
                    return;
                }

                pushUndoState();

                const idx = categoryList.indexOf(oldCatName);
                if (idx !== -1) {
                    categoryList[idx] = cleanCat;
                }

                allNotes.forEach(note => {
                    if (note.category === oldCatName) {
                        note.category = cleanCat;
                    }
                });

                if (currentCategory === oldCatName) {
                    currentCategory = cleanCat;
                }

                await saveCategoryList();
                await localforage.setItem("xhs_v10_interactive_notes", allNotes);
                renderCategories();
                filterAndRender();
                showToast("分类修改成功");
            }
        }

        async function deleteCategory(catName, event) {
            if (event) event.stopPropagation();
            if (confirm(`确定要删除分类“${catName}”吗？\n删除后，该分类下的笔记将被自动归类到“城市生活 & 探店”。`)) {
                pushUndoState();

                categoryList = categoryList.filter(c => c !== catName);

                const fallbackCat = categoryList[0] || '城市生活 & 探店';
                allNotes.forEach(note => {
                    if (note.category === catName) {
                        note.category = fallbackCat;
                    }
                });

                if (currentCategory === catName) {
                    currentCategory = 'ALL';
                }

                await saveCategoryList();
                await localforage.setItem("xhs_v10_interactive_notes", allNotes);
                renderCategories();
                filterAndRender();
                showToast("分类已删除");
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async function(results) {
                    pushUndoState();
                    showToast("正在处理导入数据...");
                    const newParsedNotes = processRawCSVData(results.data);
                    
                    const existingMap = new Map();
                    allNotes.forEach(note => {
                        const key = note.link && note.link !== '#' ? note.link : note.title;
                        existingMap.set(key, note);
                    });

                    let addedCount = 0;

                    newParsedNotes.forEach(newNote => {
                        const key = newNote.link && newNote.link !== '#' ? newNote.link : newNote.title;
                        
                        if (existingMap.has(key)) {
                            const existingNote = existingMap.get(key);
                            existingNote.likes = newNote.likes || existingNote.likes;
                            existingNote.collects = newNote.collects || existingNote.collects;
                            if (newNote.cover) existingNote.cover = newNote.cover;
                        } else {
                            allNotes.unshift(newNote);
                            addedCount++;
                        }
                    });

                    await localforage.setItem("xhs_v10_interactive_notes", allNotes);
                    event.target.value = '';
                    renderCategories();
                    filterAndRender();
                    showToast(`新增 ${addedCount} 条笔记，正在转存本地图片...`);

                    cacheMissingImages();
                }
            });
        }

        // 智能解析带单位的数字（如 "10万", "1.5w", "1200"）
        function parseCountNumber(rawVal) {
            if (!rawVal) return 0;
            const str = String(rawVal).trim().toLowerCase();
            const num = parseFloat(str.replace(/[^0-9.]/g, '')) || 0;
            if (str.includes('万') || str.includes('w')) {
                return Math.round(num * 10000);
            }
            return Math.round(num);
        }

        // 格式化展示点赞数（如 100000 显示为 10.0w）
        function formatCountDisplay(count) {
            if (count >= 10000) {
                return (count / 10000).toFixed(1) + 'w';
            }
            return count;
        }

        function extractKeywords(text, maxLength = 5) {
            if (!text) return [];
            const cleanText = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, ' ');
            const words = cleanText.split(/\s+/);
            const result = [];
            for (let word of words) {
                word = word.trim();
                if (word.length >= 2 && word.length <= maxLength && !STOP_WORDS.has(word)) {
                    result.push(word);
                }
            }
            return result;
        }

        function processRawCSVData(rawData) {
            return rawData.map((item) => {
                const getVal = (keys) => {
                    for (let k of keys) {
                        for (let itemKey in item) {
                            if (itemKey.trim().toLowerCase() === k.toLowerCase()) return item[itemKey];
                        }
                    }
                    return '';
                };

                const title = String(getVal(['标题', 'title', '笔记标题']) || '').trim();
                const remark = String(getVal(['remark', '正文', '内容', 'desc', 'content', '笔记正文']) || '').trim();
                const rawTagsStr = String(getVal(['tags', '标签', '话题', '原帖标签']) || '').trim();
                
                const author = String(getVal(['作者', 'author', '博主']) || '未知作者').trim();
                const link = String(getVal(['链接', 'link', 'url']) || '#').trim();
                const rawCover = String(getVal(['封面', 'cover', '图片', '图片地址']) || '').trim();
                
                // 使用智能解析函数，正确处理“万”或“w”单位
                const likes = parseCountNumber(getVal(['点赞数', '点赞', 'likes', 'like_count', 'liked_count']));
                const collects = parseCountNumber(getVal(['收藏数', '收藏', 'collects']));

                const fullText = (title + ' ' + remark + ' ' + rawTagsStr).toLowerCase();

                let category = '城市生活 & 探店';
                for (let [catName, keywords] of Object.entries(PROMPT_CATEGORIES)) {
                    if (keywords.some(kw => fullText.includes(kw.toLowerCase()))) {
                        category = catName;
                        break;
                    }
                }

                const titleKeywords = extractKeywords(title);
                let tag1 = titleKeywords[0] || '精选干货';

                let tag2 = '';
                if (remark) {
                    const remarkKeywords = extractKeywords(remark);
                    tag2 = remarkKeywords.find(w => w !== tag1) || '';
                }
                if (!tag2) {
                    tag2 = titleKeywords.find(w => w !== tag1) || '实用指南';
                }

                let tag3 = '';
                const rawTagsMatches = rawTagsStr.match(/#?([\u4e00-\u9fa5\w]+)/g);
                if (rawTagsMatches && rawTagsMatches.length > 0) {
                    for (let match of rawTagsMatches) {
                        const clean = match.replace('#', '').trim();
                        if (clean.length >= 2 && clean.length <= 6 && clean !== tag1 && clean !== tag2) {
                            tag3 = clean;
                            break;
                        }
                    }
                }

                if (!tag3) {
                    if (likes > 10000) tag3 = '爆款笔记';
                    else if (likes < 100 && likes > 0) tag3 = '小众收藏';
                }

                const finalTags = [tag1, tag2, tag3]
                    .filter(t => t && t.trim() !== '')
                    .map(t => `#${t.trim()}`)
                    .join(' ');

                return {
                    id: 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    title: title || '无标题笔记',
                    author, link, 
                    cover: rawCover, 
                    localCover: '',
                    likes, collects,
                    category,
                    ai_tags: finalTags,
                    myThoughts: ''
                };
            });
        }

        function renderCategories() {
            const categoryMap = {};
            allNotes.forEach(note => {
                const cat = note.category;
                categoryMap[cat] = (categoryMap[cat] || 0) + 1;
            });

            const container = document.getElementById('categoryList');
            container.innerHTML = `
                <button onclick="switchCategory('ALL')" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition ${currentCategory === 'ALL' ? 'bg-red-50 text-red-600 font-bold' : 'text-gray-600 hover:bg-gray-100'}">
                    <span class="flex items-center gap-2"><i data-lucide="layers" class="w-3.5 h-3.5"></i>全部笔记</span>
                    <span class="bg-gray-200/60 px-2 py-0.5 rounded-full text-[10px] text-gray-500">${allNotes.length}</span>
                </button>
            `;

            categoryList.forEach(cat => {
                const count = categoryMap[cat] || 0;
                const div = document.createElement('div');
                const isSelected = currentCategory === cat;
                div.className = `group w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition cursor-pointer ${isSelected ? 'bg-red-50 text-red-600 font-bold' : 'text-gray-600 hover:bg-gray-100'}`;
                div.onclick = () => switchCategory(cat);
                
                div.innerHTML = `
                    <span class="flex items-center gap-2 truncate flex-1 pr-2">
                        <i data-lucide="folder" class="w-3.5 h-3.5 shrink-0"></i>
                        <span class="truncate">${cat}</span>
                    </span>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <span class="bg-gray-200/60 px-2 py-0.5 rounded-full text-[10px] text-gray-500 group-hover:hidden">${count}</span>
                        <div class="hidden group-hover:flex items-center gap-1 text-gray-400">
                            <button onclick="editCategoryName('${cat}', event)" title="重命名" class="hover:text-blue-600 p-0.5 rounded transition">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="deleteCategory('${cat}', event)" title="删除分类" class="hover:text-red-600 p-0.5 rounded transition">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });

            lucide.createIcons();
        }

        function switchCategory(cat) {
            currentCategory = cat;
            renderCategories();
            filterAndRender();
        }

        function filterAndRender() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allNotes.filter(n => {
                if (currentCategory === 'ALL') return true;
                return n.category === currentCategory;
            });

            if (searchText) {
                filtered = filtered.filter(n => 
                    n.title.toLowerCase().includes(searchText) ||
                    n.author.toLowerCase().includes(searchText) ||
                    n.category.toLowerCase().includes(searchText) ||
                    n.ai_tags.toLowerCase().includes(searchText) ||
                    (n.myThoughts && n.myThoughts.toLowerCase().includes(searchText))
                );
            }

            const container = document.getElementById('notesContainer');
            const emptyState = document.getElementById('emptyState');
            document.getElementById('statsCount').innerText = `共 ${filtered.length} 条笔记`;

            container.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(note => {
                const card = document.createElement('div');
                card.className = "break-inside-avoid mb-4 bg-white rounded-xl shadow-sm hover:shadow-md border border-gray-200/70 overflow-hidden transition group flex flex-col";

                let displayImgUrl = note.localCover || (note.cover ? `https://images.weserv.nl/?url=${encodeURIComponent(formatUrl(note.cover))}` : '');

                const coverHtml = (note.localCover || note.cover) ? 
                    `<div class="w-full h-48 bg-gray-100 overflow-hidden relative">
                        <img src="${displayImgUrl}" alt="封面" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" onerror="this.onerror=null; this.parentElement.style.display='none';">
                    </div>` : '';

                const tagsHtml = note.ai_tags ? note.ai_tags.split(' ').map(t => `<span class="bg-red-50 text-red-600 text-[10px] font-medium px-2 py-0.5 rounded-md">${t}</span>`).join(' ') : '';

                card.innerHTML = `
                    ${coverHtml}
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <div>
                            <!-- 点赞数展示（带格式化 w 单位） -->
                            <div class="flex items-center justify-between text-[11px] text-gray-400 mb-1">
                                <div class="flex items-center gap-1 text-gray-500 font-medium">
                                    <i data-lucide="heart" class="w-3.5 h-3.5 text-red-500 fill-red-500"></i>
                                    <span>${formatCountDisplay(note.likes || 0)}</span>
                                </div>
                                <button onclick="openEditModal('${note.id}')" class="text-gray-400 hover:text-red-500 transition flex items-center gap-0.5">
                                    <i data-lucide="edit-2" class="w-3 h-3"></i> 编辑
                                </button>
                            </div>
                            
                            <h3 class="text-xs font-bold text-gray-800 line-clamp-2 leading-snug hover:text-red-500 transition">
                                ${note.title}
                            </h3>
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                ${tagsHtml}
                            </div>
                        </div>

                        <!-- 想法区域：已压缩边距，放大文本框占比 -->
                        <div class="mt-2.5 bg-gray-50 rounded-lg p-2 border border-gray-200/80 text-xs flex flex-col gap-1">
                            <div class="text-[10px] font-bold text-gray-500 flex items-center justify-between">
                                <span class="flex items-center gap-1"><i data-lucide="pen-tool" class="w-3 h-3 text-gray-400"></i> 我的想法</span>
                                <button onclick="saveThoughts('${note.id}')" class="text-gray-600 hover:text-gray-900 bg-gray-200/80 hover:bg-gray-300 px-2 py-0.5 rounded text-[10px] font-bold transition flex items-center gap-0.5">
                                    <i data-lucide="check" class="w-3 h-3"></i> 保存
                                </button>
                            </div>
                            <textarea id="thought-input-${note.id}"
                                      placeholder="记录对此笔记的想法、备忘或灵感..." 
                                      class="w-full bg-white border border-gray-200 rounded p-1.5 text-gray-700 text-xs focus:outline-none focus:ring-1 focus:ring-red-400 resize-none placeholder-gray-400 min-h-[68px] leading-relaxed">${note.myThoughts || ''}</textarea>
                        </div>

                        <!-- 底部栏保留作者与打开原文 -->
                        <div class="flex items-center justify-between mt-2.5 pt-2 text-[11px] text-gray-400 border-t border-gray-100">
                            <span class="text-gray-400 text-[11px] truncate max-w-[140px]">${note.author || '小红书'}</span>
                            <a href="${note.link}" target="_blank" class="flex items-center gap-1 text-xs text-blue-600 hover:underline font-medium ml-auto">
                                打开原文 <i data-lucide="external-link" class="w-3 h-3"></i>
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            changeColumns(currentCols);
            lucide.createIcons();
        }

        async function saveThoughts(noteId) {
            const textarea = document.getElementById(`thought-input-${noteId}`);
            if (!textarea) return;

            const val = textarea.value;
            const note = allNotes.find(n => n.id === noteId);
            if (note) {
                pushUndoState();
                note.myThoughts = val;
                await localforage.setItem("xhs_v10_interactive_notes", allNotes);
                showToast("保存成功");
            }
        }

        function openEditModal(noteId) {
            const note = allNotes.find(n => n.id === noteId);
            if (!note) return;

            document.getElementById('editNoteId').value = noteId;
            document.getElementById('editTitleInput').value = note.title || '';
            document.getElementById('editCoverInput').value = note.cover || '';
            document.getElementById('editTagsInput').value = note.ai_tags || '';

            const select = document.getElementById('editCategorySelect');
            select.innerHTML = '';
            categoryList.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                if (cat === note.category) opt.selected = true;
                select.appendChild(opt);
            });

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveNoteEdit() {
            const noteId = document.getElementById('editNoteId').value;
            const note = allNotes.find(n => n.id === noteId);
            if (!note) return;

            pushUndoState();

            note.title = document.getElementById('editTitleInput').value.trim() || '无标题笔记';
            note.category = document.getElementById('editCategorySelect').value;
            
            const newCover = document.getElementById('editCoverInput').value.trim();
            if (newCover !== note.cover) {
                note.cover = newCover;
                note.localCover = '';
            }

            let tagsVal = document.getElementById('editTagsInput').value.trim();
            if (tagsVal) {
                note.ai_tags = tagsVal.split(/\s+/).map(t => t.startsWith('#') ? t : `#${t}`).join(' ');
            } else {
                note.ai_tags = '';
            }

            await localforage.setItem("xhs_v10_interactive_notes", allNotes);
            closeEditModal();
            renderCategories();
            filterAndRender();
            showToast("修改已保存");

            cacheMissingImages();
        }

        function exportBackupJSON() {
            if (allNotes.length === 0) {
                alert("当前暂无可导出的数据！");
                return;
            }
            const backupData = {
                version: "1.3",
                exportTime: new Date().toISOString(),
                categories: categoryList,
                notes: allNotes
            };
            const jsonStr = JSON.stringify(backupData, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `小红书收藏夹备份_含本地图片_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("导出备份成功");
        }

        function handleJSONImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data && Array.isArray(data.notes)) {
                        pushUndoState();
                        allNotes = data.notes;
                        if (Array.isArray(data.categories)) {
                            categoryList = Array.from(new Set([...categoryList, ...data.categories]));
                            await saveCategoryList();
                        }
                        await localforage.setItem("xhs_v10_interactive_notes", allNotes);
                        event.target.value = '';
                        renderCategories();
                        filterAndRender();
                        showToast("恢复备份成功");
                    } else {
                        alert("无效的备份文件格式！");
                    }
                } catch(err) {
                    alert("解析备份文件失败！");
                }
            };
            reader.readAsText(file);
        }

        async function clearData() {
            if (confirm("确定要清空本地所有已整理的笔记数据吗？此操作无法撤销！")) {
                pushUndoState();
                await localforage.removeItem("xhs_v10_interactive_notes");
                allNotes = [];
                renderCategories();
                filterAndRender();
                showToast("已清空所有数据");
            }
        }
    </script>
</body>
</html>
